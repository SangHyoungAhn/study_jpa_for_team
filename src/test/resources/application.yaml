spring:
  application:
    name: studyjpa

  datasource:
    url:  jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:


  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
  #  sql:
  #    init:
  #      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console