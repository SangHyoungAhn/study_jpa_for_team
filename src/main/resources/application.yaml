spring:
  application:
    name: studyjpa

  datasource:
    url:  jdbc:h2:tcp://localhost/~/studyjpa
    username: sa
    password:


  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console