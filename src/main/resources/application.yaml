spring:
  application:
    name: studyjpa

  datasource:
    url:  jdbc:h2:tcp://localhost/~/studyjpa
    username: sa
    password:


  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        # ── 쓰기 배치(batch) 설정: 변경 감지/저장 시 쿼리를 모아 한 번에 보냄 ──
        # jdbc:
        #   batch_size: 50      # flush 때 INSERT/UPDATE/DELETE를 50개씩 묶어 DB로 전송
        # order_inserts: true   # 같은 테이블 INSERT끼리 정렬해 묶음 효율↑ (※ Member는 IDENTITY라 INSERT는 안 묶임)
        # order_updates: true   # 같은 테이블 UPDATE끼리 정렬 → 변경 감지가 만든 UPDATE가 배치로 묶임
        # generate_statistics: true   # 배치가 실제로 묶였는지 통계 로그로 확인용
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
#  sql:
#    init:
#      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console